name: fslite-showcase

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      astro:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      SHOWCASE_HOSTNAME: ${SHOWCASE_HOSTNAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health/live"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  astro:
    build:
      context: ../..
      dockerfile: showcase/Dockerfile
    restart: unless-stopped
    depends_on:
      fslite-server:
        condition: service_healthy
    environment:
      FSLITE_SERVER_URL: http://fslite-server:8080
      FSLITE_TOKEN_FILE: /run/secrets/fslite_token
      FSLITE_RESET_INTERVAL_MS: "900000"
      FSLITE_TRUST_PROXY: "true"
    secrets:
      - source: fslite_token
        target: fslite_token
        mode: 0444
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/api/health/ready"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12

  fslite-server:
    build:
      context: ../..
      dockerfile: crates/fslite-server/Dockerfile
    restart: unless-stopped
    environment:
      FSLITE_DB: /data/fslite.db
      FSLITE_CONFIG: /data/server.json
      FSLITE_BIND: 0.0.0.0:8080
      FSLITE_TOKEN_FILE: /run/secrets/fslite_token
    volumes:
      - fslite_data:/data
    secrets:
      - source: fslite_token
        target: fslite_token
        mode: 0444
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

secrets:
  fslite_token:
    file: ./fslite-token

volumes:
  caddy_config:
  caddy_data:
  fslite_data:
