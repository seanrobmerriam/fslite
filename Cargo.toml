[workspace]
resolver = "3"
members = [
  "crates/fslite-core",
  "crates/fslite-sqlite",
  "crates/fslite-conformance",
  "crates/fslite-server",
  "crates/fslite-command",
  "crates/fslite-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A transport-independent, async virtual filesystem with a SQLite-backed persistent backend, HTTP adapter, and CLI."
repository = "https://github.com/seanrobmerriam/fslite"
homepage = "https://fslite.rusty.yachts"
documentation = "https://docs.rs/fslite-core"
readme = "README.md"
keywords = ["filesystem", "sqlite", "virtual-filesystem", "async", "workspace"]
categories = ["database", "filesystem"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
async-trait = "0.1"
atomic-write-file = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
futures = "0.3"
http-body-util = "0.1"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-rusqlite = "0.6"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
